<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f8f6f0">
  <meta name="robots" content="noindex,nofollow">
  <title>Acessar · THIGAS AI</title>
  <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <style>
    :root{color-scheme:light; font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top left,#f6d1bd 0,transparent 40%),#f8f6f0;color:#24362a}
    .card{width:min(100%,420px);padding:32px;border:1px solid #e5e6db;background:#fff;border-radius:24px;box-shadow:0 18px 70px #263b2a17}
    .identity{display:flex;align-items:center;gap:14px;margin-bottom:28px}.identity img{width:64px;height:64px}.identity strong{font-size:21px;display:block;letter-spacing:-.5px}.identity small{color:#66806a}
    h1{font-size:25px;letter-spacing:-.7px;margin:0 0 8px}p{color:#56665a;line-height:1.5;margin:0 0 25px;font-size:14px}
    label{display:block;font-size:13px;font-weight:650;margin:18px 0 7px}input{width:100%;min-height:48px;border:1px solid #ccd5cd;border-radius:12px;background:#fbfcfa;padding:12px 14px;font-size:16px;outline:none}
    input:focus{border-color:#4b8054;box-shadow:0 0 0 3px #4b805422}
    button{width:100%;margin-top:26px;min-height:50px;border:0;border-radius:13px;background:#284b31;color:#fff;font-size:15px;font-weight:650;cursor:pointer}
    button:hover{background:#1d3f26}.error{color:#9f2020;background:#fff0f0;border:1px solid #f4c5c5;padding:12px;border-radius:10px;margin-bottom:12px}
    footer{text-align:center;margin-top:23px;color:#718076;font-size:12px}
  </style>
</head>
<body>
  <main class="card">
    <div class="identity">
      <img src="/static/icons/icon.svg" alt="Símbolo THIGAS AI">
      <div><strong>THIGAS AI</strong><small>Brittech inc.</small></div>
    </div>
    <h1>Acesse seu assistente</h1>
    <p>Entre com o usuário e a senha de acesso ao THIGAS AI. O acesso é o mesmo no navegador e no aplicativo instalado.</p>
    <!--THIGAS-ERROR-->
    <form action="/login" method="post" autocomplete="on">
      <label for="username">Usuário</label>
      <input id="username" name="username" type="text" autocomplete="username" minlength="1" maxlength="128" required autofocus>
      <label for="password">Senha</label>
      <input id="password" name="password" type="password" autocomplete="current-password" maxlength="512" required>
      <button type="submit">Entrar no THIGAS AI</button>
    </form>
    <footer>Conexão segura · Acesso restrito</footer>
  </main>
</body>
</html>
