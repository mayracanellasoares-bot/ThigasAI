name: Retirar APKs antigos
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/retire-apk.yml"]
permissions:
  actions: write
jobs:
  remover-apks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Apagar somente os APKs anteriores à migração PWA
        uses: actions/github-script@v7
        with:
          script: |
            const cutoff = Date.parse("2026-10-03T03:34:57Z");
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const retired = artifacts.filter(artifact =>
              artifact.name === "THIGAS-Coder-APK" &&
              Date.parse(artifact.created_at) <= cutoff
            );
            for (const artifact of retired) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
              core.info(`APK antigo removido: ${artifact.id}`);
            }
            await core.summary.addHeading("Migração THIGAS para PWA")
              .addRaw(`${retired.length} artefato(s) antigo(s) do APK removido(s). Nenhum outro artefato foi alterado.`)
              .write();
