name: Sincronizar assets de desenvolvimento
on:
  push:
    branches: ["feat/documentos-codigo-download-20261016"]
    paths: [".github/workflows/assets-build-once.yml"]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build reproduzivel
        run: python scripts/build_web_assets.py
      - name: Commitar apenas arquivos gerados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/static/chat-ui.css server/static/index.html server/static/sw.js
          if ! git diff --cached --quiet; then
            git commit -m "build(pwa): sincronizar hashes por conteudo"
            git push origin HEAD:feat/documentos-codigo-download-20261016
          fi
