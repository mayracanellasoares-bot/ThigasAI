name: THIGAS AI - qualidade

on:
  pull_request:
  push:
    branches: [main, "feat/documentos-codigo-download-20261016"]

jobs:
  python-and-browser-logic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dependencias de documento
        run: python -m pip install -r server/requirements.txt
      - name: Testes de API e geracao de arquivos
        run: python -m unittest discover -s server/tests -p "test_*.py"
      - name: Testes de interface e PWA
        run: node --test server/tests/chat.test.cjs server/tests/pwa.test.cjs
      - name: Sintaxe Python
        run: python -m compileall -q server
      - name: Sintaxe JavaScript
        run: node --check server/static/chat.js && node --check server/static/octonous.js
