services:
  - type: web
    name: thigas-coder-gateway
    runtime: python
    plan: free
    region: virginia
    buildCommand: pip install -r server/requirements.txt
    startCommand: gunicorn --chdir server app:app --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 660 --graceful-timeout 60
    healthCheckPath: /health
    envVars:
      - key: MARITACA_API_KEY
        sync: false
      - key: MARITACA_MODEL
        value: sabia-4
      - key: MARITACA_FAST_MODEL
        value: sabiazinho-4
      - key: MARITACA_MAX_TOKENS
        value: "32768"
      - key: MARITACA_URL
        value: https://chat.maritaca.ai/api/chat/completions
      - key: MARITACA_THINKING_MODEL
        value: sabia-4-thinking
      - key: THIGAS_ENABLE_THINKING
        value: "true"
      # THIGAS AI now exposes only Rápido, Equilibrado and Avançado.
      # Retired providers are not configured by this blueprint.
      - key: THIGAS_BRAVE_SEARCH_KEY
        sync: false
      - key: THIGAS_BRAVE_SEARCH_ENABLED
        value: "false"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_WEBHOOK_URL
        value: https://thigas-coder-gateway.onrender.com/telegram/webhook
      - key: THIGAS_TELEGRAM_ALLOWED_USERS
        sync: false
      - key: THIGAS_SESSION_SECRET
        sync: false
      - key: THIGAS_ACCESS_PASSWORD
        sync: false
      - key: THIGAS_DATA_DIR
        value: /tmp/thigas-documents
