services:
  - type: web
    name: thigas-coder-gateway
    runtime: python
    plan: free
    region: virginia
    buildCommand: pip install -r server/requirements.txt
    startCommand: gunicorn --chdir server app:app --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 660 --graceful-timeout 60
    healthCheckPath: /health
    envVars:
      - key: MARITACA_API_KEY
        sync: false
      - key: MARITACA_MODEL
        value: sabiazinho-4
      - key: MARITACA_MAX_TOKENS
        value: "16384"
      - key: MARITACA_URL
        value: https://chat.maritaca.ai/api/chat/completions
      - key: MARITACA_THINKING_MODEL
        value: sabia-4-thinking-br-sp
      - key: THIGAS_ENABLE_THINKING
        value: "false"
      - key: THIGAS_CLOUD_API_KEY
        sync: false
      - key: THIGAS_CLOUD_ENABLED
        value: "false"
      - key: THIGAS_CLOUD_URL
        value: https://api.groq.com/openai/v1/chat/completions
      - key: THIGAS_CLOUD_MODEL
        value: openai/gpt-oss-20b
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_WEBHOOK_URL
        value: https://thigas-coder-gateway.onrender.com/telegram/webhook
      - key: THIGAS_TELEGRAM_ALLOWED_USERS
        sync: false
      - key: THIGAS_SESSION_SECRET
        sync: false
      - key: THIGAS_DATA_DIR
        value: /tmp/thigas-documents
